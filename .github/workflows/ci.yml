name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed viewer assets are up to date
        run: git diff --exit-code -- src/concurim/viewer/static

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      # Screenshot baselines are committed for macOS only; create Linux ones.
      - run: npx playwright test --update-snapshots=missing
        working-directory: frontend

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: scripts/build.sh
      - run: scripts/smoke_wheel.sh
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
