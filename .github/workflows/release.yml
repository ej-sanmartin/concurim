# Publishes to PyPI with Trusted Publishing (OIDC): no stored API token.
# One-time setup, done by the maintainers on pypi.org: add this repository,
# workflow `release.yml` and environment `pypi` as a trusted publisher.
# Triggered only by pushing a version tag such as v0.1.0.
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync && uv run pytest
      - run: scripts/build.sh
      - run: scripts/smoke_wheel.sh
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # short-lived OIDC credential
      contents: write   # to create the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
