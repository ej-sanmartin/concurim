# Publishes to PyPI when a version tag is pushed, for example v1.0.0.
# One-time setup on https://pypi.org/manage/account/publishing/ :
# pending publisher for project concurim, owner ej-sanmartin,
# repository concurim, workflow release.yml, environment pypi.
# No API token. Do not also upload that same version by hand.
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/concurim/__init__.py | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$tag" = "$version"
          test "$init" = "$version"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync && uv run pytest
      - run: scripts/build.sh
      - run: scripts/smoke_wheel.sh
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/concurim/
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
