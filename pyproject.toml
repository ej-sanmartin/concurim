[project]
name = "concurim"
# Published by the v<version> tag. Keep this equal to __version__
# in src/concurim/__init__.py.
version = "1.0.0"
description = "See how Python runs together: record and replay concurrent execution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Concurim contributors" }]
keywords = [
  "concurrency",
  "visualization",
  "threading",
  "asyncio",
  "queue",
  "debugging",
  "observability",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# A bundled ffmpeg for `concurim export`; a system ffmpeg works too.
video = ["imageio-ffmpeg>=0.5"]

[project.scripts]
concurim = "concurim.cli:main"

[project.urls]
Homepage = "https://github.com/ej-sanmartin/concurim"
Documentation = "https://github.com/ej-sanmartin/concurim/blob/main/docs/index.md"
Source = "https://github.com/ej-sanmartin/concurim"
Issues = "https://github.com/ej-sanmartin/concurim/issues"
Changelog = "https://github.com/ej-sanmartin/concurim/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4", "ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concurim"]
# Compiled viewer assets are committed under viewer/static (see
# scripts/build.sh), so they ship even though they are build output.
artifacts = [
  "src/concurim/viewer/static/**",
  "src/concurim/samples/*.concurim",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "frontend/src", "frontend/*.json",
  "frontend/*.ts", "frontend/*.html", "docs", "scripts", "README.md",
  "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
  "pyproject.toml"]
artifacts = [
  "src/concurim/viewer/static/**",
  "src/concurim/samples/*.concurim",
]

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/concurim/samples/*.py" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["concurrency: repeated scheduling-sensitive tests"]
